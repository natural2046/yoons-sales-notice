<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>사장단 공지 — 영업실적 · 자료실</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f9f9f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    color: #0b0b0b;
  }
  .card {
    background: #fcfcfb;
    border: 1px solid rgba(11,11,11,0.10);
    border-radius: 16px;
    padding: 48px 56px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 8px;
  }
  .group-label {
    font-size: 0.8rem;
    color: rgba(11,11,11,0.45);
    margin: 24px 0 10px;
    text-align: left;
    font-weight: 600;
  }
  .group-label:first-of-type {
    margin-top: 0;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  a.notice-link {
    display: block;
    padding: 16px 20px;
    border-radius: 10px;
    background: #2a78d6;
    color: #fff;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    transition: opacity 0.15s ease;
  }
  a.notice-link:hover {
    opacity: 0.88;
  }
  a.notice-link.gyeonggi { background: #eb6834; }
  a.notice-link.incheon-gimpo { background: #2f9e6f; }
  a.notice-link.chungcheong { background: #7a5cc9; }

</head>

    <div class="links">

    <div class="group-label">인천김포 · 충청대전세종 (김미옥 매니저)</div>
    <div class="links">
      <a class="notice-link incheon-gimpo" href="incheon_gimpo.html">인천김포 사장단 공지 바로가기</a>
